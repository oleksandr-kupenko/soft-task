<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-label="soft-task flow">
  <defs>
    <style>
      .s { fill: #EBF4FF; stroke: #2B6CB0; stroke-width: 2; rx: 8; }
      .g { fill: #FFF5F5; stroke: #C53030; stroke-width: 1.5; rx: 6; }
      .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1A365D; font-size: 12px; font-weight: 600; }
      .u { font-family: ui-sans-serif, system-ui, sans-serif; fill: #4A5568; font-size: 10px; }
      .title { font-size: 18px; font-weight: 700; fill: #2B6CB0; }
      .a { stroke: #2B6CB0; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <text x="24" y="28" class="title">soft-task  flight</text>
  <!-- stages -->
  <rect class="s" x="20" y="60" width="100" height="56"/><text x="40" y="85" class="t">Setup</text><text x="36" y="102" class="u">preflight</text>
  <path class="a" d="M120 88 H140"/>
  <rect class="s" x="140" y="60" width="100" height="56"/><text x="152" y="85" class="t">Requirements</text><text x="162" y="102" class="u">manifest</text>
  <path class="a" d="M240 88 H260"/>
  <rect class="s" x="260" y="60" width="100" height="56"/><text x="282" y="85" class="t">Briefing</text><text x="282" y="102" class="u">questions</text>
  <path class="a" d="M360 88 H380"/>
  <rect class="s" x="380" y="60" width="100" height="56"/><text x="410" y="85" class="t">Spec</text><text x="408" y="102" class="u">+ notes</text>
  <path class="a" d="M480 88 H500"/>
  <rect class="s" x="500" y="60" width="100" height="56"/><text x="530" y="85" class="t">Plan</text><text x="522" y="102" class="u">tickets</text>
  <path class="a" d="M600 88 H620"/>
  <rect class="s" x="620" y="60" width="100" height="56"/><text x="648" y="85" class="t">Build</text><text x="638" y="102" class="u">Softoria-HD</text>
  <path class="a" d="M720 88 H740"/>
  <rect class="s" x="740" y="60" width="100" height="56"/><text x="764" y="85" class="t">Review</text><text x="758" y="102" class="u">point+branch</text>
  <path class="a" d="M840 88 H860"/>
  <rect class="s" x="860" y="60" width="100" height="56"/><text x="876" y="85" class="t">Acceptance</text><text x="888" y="102" class="u">blind G4</text>

  <!-- gates -->
  <rect class="g" x="270" y="150" width="70" height="36"/><text x="290" y="172" class="t">G1</text>
  <rect class="g" x="400" y="150" width="70" height="36"/><text x="420" y="172" class="t">G2</text>
  <rect class="g" x="520" y="150" width="70" height="36"/><text x="540" y="172" class="t">G3</text>
  <rect class="g" x="880" y="150" width="70" height="36"/><text x="900" y="172" class="t">G4</text>
  <text x="24" y="172" class="u">Gates check the build against the user's own words.</text>
</svg>
