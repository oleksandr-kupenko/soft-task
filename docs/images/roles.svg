<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="soft-task roles">
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <text x="32" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2B6CB0">soft-task — roles</text>
  <rect x="40" y="70" width="200" height="90" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="56" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A365D">User</text>
  <text x="56" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">brief / ticket text</text>
  <path d="M250 115 H310" stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <rect x="310" y="60" width="260" height="110" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="326" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A365D">Orchestrator</text>
  <text x="326" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">OpenCode · Cursor · Claude · Codex</text>
  <text x="326" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">dispatches, never writes app code</text>
  <path d="M440 170 V210" stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <rect x="80" y="220" width="220" height="100" rx="10" fill="#F7FAFC" stroke="#1A365D" stroke-width="2"/>
  <text x="96" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A365D">Executor</text>
  <text x="96" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">Softoria-HD via opencode run</text>
  <text x="96" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">one ticket · fresh context</text>
  <rect x="350" y="220" width="220" height="100" rx="10" fill="#F7FAFC" stroke="#1A365D" stroke-width="2"/>
  <text x="366" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A365D">Reviewer</text>
  <text x="366" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">Softoria-HD (default)</text>
  <text x="366" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">or harness subagent</text>
  <rect x="620" y="220" width="240" height="100" rx="10" fill="#EDF2F7" stroke="#4A5568" stroke-width="2"/>
  <text x="636" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A365D">Vision</text>
  <text x="636" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">Softoria-SD · see.sh</text>
  <text x="636" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">specs &amp; screenshot QA</text>
  <path d="M190 170 V210" stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <path d="M570 170 V210" stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <path d="M540 115 H620 V210" stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <text x="32" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A5568">Repo working tree is shared; only the executor writes application code.</text>
