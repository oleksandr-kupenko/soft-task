<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soft-task</title>
<link rel="icon" id="favicon" type="image/png" href="">
<style>
  /* Цвет здесь — сигнал, а не украшение: у каждого состояния сборки свой.
     Синий — идёт работа, оранжевый — ждём человека или таск пишется,
     зелёный — сдано, бирюзовый — проверка, фиолетовый — ремонт, красный — упало. */
  :root{
  --accent:#2E51ED;
  --accent-2:#0E7FE1;
  --accent-soft:#EBF0FF;
    --bg:#F5F5F5; --card:#fff; --inset:#F0F0F0; --soft:#E9EBED; --line:#E9EBED; --line2:#D5D8DB;
    --tx:#181A1C; --tx2:#33373B; --mut:#545A61; --quiet:#757575;
    --hero:linear-gradient(135deg,#DDF6F6 0%,#E7EEFF 100%); --hero-shadow:rgba(46,81,237,.12);
    --hero-tx:#181A1C; --hero-mut:rgba(24,26,28,.68); --hero-track:rgba(24,26,28,.12);
    --done:#17864A; --done-soft:#E2F3E9; --done-tx:#126B3B;
    --now:#16D9D9; --now-on:#181A1C; --now-soft:#DDF8F8; --now-tx:#0A7C7C;
    --rev:#2E51ED; --rev-soft:#E6EBFF; --rev-tx:#2342CC;
    --fix:#7C3AED; --fix-soft:#EFE7FE; --fix-tx:#6427D0;
    --bad:#DD0000; --bad-soft:#FDE6E6; --bad-tx:#B01C1C;
    --idle:#C1C1C1; --logo-filter:none;
    --sh:none;
    --sh-raised:none;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#000; --card:#111315; --inset:#1B1E21; --soft:#24282C; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
      --tx:#FFFFFF; --tx2:#D5D8DB; --mut:#9AA1A8; --quiet:#7A8087;
      --hero:linear-gradient(135deg,#0F2B2E 0%,#141C3A 100%); --hero-shadow:rgba(0,0,0,.6);
    --hero-tx:#fff; --hero-mut:rgba(255,255,255,.78); --hero-track:rgba(255,255,255,.16);
      --done:#1E9A56; --done-soft:#12291D; --done-tx:#5BD68C;
      --now-soft:#0B3333; --now-tx:#5CF0F0;
      --rev:#4A6BFF; --rev-soft:#16204A; --rev-tx:#9DB1FF;
      --fix:#8B4DF5; --fix-soft:#2F2448; --fix-tx:#BFA2FF;
      --bad:#E5383B; --bad-soft:#3A1717; --bad-tx:#FF8B8B;
      --idle:#3A3F44; --logo-filter:invert(1);
      --sh:none;
      --sh-raised:none;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000; --card:#111315; --inset:#1B1E21; --soft:#24282C; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
    --tx:#FFFFFF; --tx2:#D5D8DB; --mut:#9AA1A8; --quiet:#7A8087;
    --hero:linear-gradient(135deg,#0F2B2E 0%,#141C3A 100%); --hero-shadow:rgba(0,0,0,.6);
    --hero-tx:#fff; --hero-mut:rgba(255,255,255,.78); --hero-track:rgba(255,255,255,.16);
    --done:#1E9A56; --done-soft:#12291D; --done-tx:#5BD68C;
    --now-soft:#0B3333; --now-tx:#5CF0F0;
    --rev:#4A6BFF; --rev-soft:#16204A; --rev-tx:#9DB1FF;
    --fix:#8B4DF5; --fix-soft:#2F2448; --fix-tx:#BFA2FF;
    --bad:#E5383B; --bad-soft:#3A1717; --bad-tx:#FF8B8B;
    --idle:#3A3F44; --logo-filter:invert(1);
    --sh:none;
    --sh-raised:none;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 "Instrument Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-synthesis-weight:none}
  ::selection{background:rgba(22,217,217,.25)}
  :focus-visible{outline:2px solid var(--now);outline-offset:3px}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .tnum,.big b,.tv,.s-time,.tl-time,.ev em{font-variant-numeric:tabular-nums}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);padding:24px 26px;min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  .wt{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3;display:flex;align-items:center;gap:10px}
  .whead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:14px;color:var(--mut)}

  /* ── верх ─────────────────────────────────────────────────── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .logo-mark{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--accent, #2B6CB0);
  padding: 4px 0;
}
.logo{height:34px;width:34px;display:block;filter:none}
  .brand{display:inline-flex;align-items:center;gap:10px}
  .wm{font-family:Figtree,"Instrument Sans",system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--tx);line-height:1}
  .wm i{font-style:normal;color:var(--now)}
  .l-dk{display:none}
  :root[data-theme="dark"] .l-lt{display:none}:root[data-theme="dark"] .l-dk{display:block}
  @media (prefers-color-scheme:dark){:root:not([data-theme]) .l-lt{display:none}:root:not([data-theme]) .l-dk{display:block}}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:inline-flex;gap:2px;padding:3px;border-radius:6px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-raised)}
  .tabs button,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tabs button{height:36px;min-width:40px;padding:0 12px;border-radius:6px;background:transparent;color:var(--mut);font-size:13.5px;font-weight:650;transition:background .2s,color .2s}
  .tabs button:hover{color:var(--tx)}
  .tabs button[aria-pressed="true"]{background:var(--tx);color:var(--card)}
  .iconbtn{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-raised);color:var(--tx);transition:transform .15s}
  .iconbtn:active{transform:scale(.96)}
  /* «Обновить сейчас»: пока state.js грузится, стрелка крутится — нажатие видно */
  .iconbtn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title h1{margin:0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:6px;background:var(--card);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--tx2)}
  .meta .when{font-size:14px;color:var(--mut);margin-left:4px}
  #link{background:var(--now);color:var(--now-on);border-radius:18px;padding:14px 18px;font-weight:600;font-size:14.5px;line-height:1.45;margin-bottom:0}
  .lost{max-width:1320px;margin:0 auto;padding:16px 32px 0}

  /* ── шапка состояния ─────────────────────────────────────────── */
  .hero{--h-tx:var(--hero-tx);--h-mut:var(--hero-mut);--h-track:var(--hero-track);
    border:1px solid var(--line2);border-radius:10px;padding:28px 30px 26px;display:flex;flex-direction:column;gap:28px;
    background:var(--hero);color:var(--h-tx);box-shadow:0 30px 60px -32px var(--hero-shadow);min-width:0}
  .hero.ask{background:#16D9D9;--h-tx:#181A1C;--h-mut:rgba(24,26,28,.74);--h-track:rgba(24,26,28,.16);box-shadow:0 30px 60px -30px rgba(200,70,20,.6)}
  .hero.won{background:#17864A;--h-tx:#fff;--h-mut:rgba(255,255,255,.85);--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(23,134,74,.6)}
  .hero.bad{background:#C81E1E;--h-tx:#fff;--h-mut:rgba(255,255,255,.85);--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(200,30,30,.55)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px}
  .hero-main{flex:1 1 420px;min-width:0}
  .state{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:12px}
  .hero h2{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16.5px;line-height:1.5;color:var(--h-mut);max-width:64ch}
  .lead b{color:var(--h-tx);font-weight:650}
  .big{text-align:right;flex:0 0 auto}
  .big b{display:block;font-size:58px;line-height:.95;font-weight:700;letter-spacing:-.045em}
  .big b small{font-size:24px;letter-spacing:-.02em;font-weight:600;margin-left:6px}
  .big>span{display:block;font-size:14px;color:var(--h-mut);margin-top:10px}
  .big .paused{display:block;margin-top:6px;font-weight:650;color:var(--h-tx)}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 18px;border-radius:22px;background:#181A1C;color:#fff;font-size:15px;font-weight:600;line-height:1.35}
  .track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .seg{height:12px;border-radius:4px;background:var(--h-track);overflow:hidden}
  .seg i{display:block;height:100%;border-radius:4px}
  .s-done .seg i{width:100%;background:#21A35B}
  .hero.won .s-done .seg i,.hero.bad .s-done .seg i{background:#fff}
  .hero.ask .s-done .seg i{background:#181A1C}
  .s-now .seg i{background-color:var(--now)}
  .hero.ask .s-now .seg i{background-color:#fff}
  .s-fail .seg i{width:100%;background:#fff}
  .s-skip .seg{background:repeating-linear-gradient(135deg,var(--h-track) 0 4px,transparent 4px 8px)}
  .s-name{display:block;margin-top:10px;font-size:13px;font-weight:600;line-height:1.3}
  .s-now .s-name,.s-fail .s-name{font-weight:750}
  .s-pend .s-name,.s-skip .s-name{color:var(--h-mut);font-weight:500}
  .s-time{display:block;margin-top:2px;font-size:12.5px;color:var(--h-mut)}
  .live{width:9px;height:9px;border-radius:50%;background:var(--now);outline:2px solid rgba(255,255,255,.9);display:inline-block;flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#181A1C;outline:0}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,217,217,.6)}70%{box-shadow:0 0 0 9px rgba(22,217,217,0)}100%{box-shadow:0 0 0 0 rgba(22,217,217,0)}}
  .badge-ic{width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .hero.won .badge-ic{color:#17864A}.hero.bad .badge-ic{color:#C81E1E}
  .stripes{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
  .hero.ask .stripes{background-image:linear-gradient(135deg,rgba(22,217,217,.5) 25%,transparent 25%,transparent 50%,rgba(22,217,217,.5) 50%,rgba(22,217,217,.5) 75%,transparent 75%,transparent)}
  @keyframes stripes{to{background-position:22px 0}}

  /* ── плитки ───────────────────────────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .tile{display:flex;flex-direction:column;gap:11px;padding:20px 22px}
  .tk{font-size:13.5px;font-weight:600;color:var(--mut)}
  .tv{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.04em}
  .tv small{font-size:17px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
  .tv.dim{color:var(--quiet)}
  .ts{font-size:13px;color:var(--mut);line-height:1.4}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--inset)}
  .stack i{display:block;height:100%}
  .sq{display:flex;gap:5px;flex-wrap:wrap}
  .sq i{width:18px;height:18px;border-radius:5px;display:block}
  .okb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:700;align-self:flex-start;color:#fff}

  /* ── цвета статусов ───────────────────────────────────────── */
  .f-done{background:var(--done);color:#fff}
  .f-now{background-color:var(--now);color:var(--now-on)}
  .f-rev{background:var(--rev);color:#fff}
  .f-fix{background:var(--fix);color:#fff}
  .f-bad{background:var(--bad);color:#fff}
  .f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .f-idle{background:var(--idle)}
  .f-q{background:var(--quiet)}

  /* ── ход сборки ───────────────────────────────────────────── */
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .lg{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:6px;background:var(--inset);font-size:13px;font-weight:600;color:var(--tx2)}
  .lg i{width:11px;height:11px;border-radius:3px;display:block}
  .lg b{font-weight:750;color:var(--tx)}
  .wave{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--quiet);margin:18px 0 8px}
  .whead+.wave{margin-top:4px}
  .wave span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
  .tl{display:grid;grid-template-columns:32px minmax(0,1fr) 64px;gap:4px 12px;align-items:center;margin-bottom:7px}
  .tl-id{font-size:14.5px;font-weight:750;color:var(--quiet)}
  .tl-id.on{color:var(--tx)}
  .ag{flex:0 1 auto;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto;font-family:ui-monospace,"Martian Mono","SF Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;opacity:.78}
  .f-wait .ag{opacity:1;color:var(--quiet)}
  .lead .ag-in{font-family:ui-monospace,"Martian Mono",Menlo,Consolas,monospace;font-size:.82em;opacity:.8}
  h1,h2,h3,.tv,.big b{font-family:Figtree,"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif}
  .title h1,.hero h2{font-weight:800}
  .bar{height:42px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 0 15px;font-size:14.5px;font-weight:650;min-width:0}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .chipin{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:700;white-space:nowrap}
  .f-now .chipin{background:rgba(24,26,28,.12)}
  .f-wait .chipin{background:var(--inset);color:var(--mut)}
  .tl-time{font-size:13.5px;font-weight:650;text-align:right;color:var(--mut);white-space:nowrap}
  .tl-time.now{color:var(--now-tx)}.tl-time.fix{color:var(--fix-tx)}.tl-time.rev{color:var(--rev-tx)}.tl-time.bad{color:var(--bad-tx)}
  .tl-note{grid-column:2/4;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:1px 2px 6px;overflow-wrap:anywhere}
  .tl-note.fix{color:var(--fix-tx)}.tl-note.rev{color:var(--rev-tx)}.tl-note.bad{color:var(--bad-tx)}
  .tl-note .ic{margin-top:2px}

  /* ── колонки и списки ─────────────────────────────────────── */
  .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{appearance:none;height:36px;padding:0 14px;border-radius:6px;border:0;background:var(--soft);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip i{width:9px;height:9px;border-radius:3px;display:block}
  .chip span{color:var(--mut);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--tx);color:var(--card)}
  .chip[aria-pressed="true"] span{color:inherit;opacity:.7}
  .req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .req p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
  .rid{display:inline-block;min-width:40px;font-size:12px;color:var(--quiet);font-weight:750}
  .why{display:block;font-size:13px;color:var(--mut);margin-top:3px;padding-left:40px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .p-done{background:var(--done-soft);color:var(--done-tx)}
  .p-now{background:var(--now-soft);color:var(--now-tx)}
  .p-mut{background:var(--inset);color:var(--mut)}
  .p-bad{background:var(--bad-soft);color:var(--bad-tx)}
  .more{margin-top:2px;padding-top:12px;border-top:1px solid var(--line)}
  .btn-soft{appearance:none;height:38px;padding:0 15px;border-radius:6px;border:0;background:var(--soft);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .gate{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
  .whead+.gate{border-top:0;padding-top:0}
  .gi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .gi.ok{background:var(--done);color:#fff}
  .gi.wait{color:var(--quiet);border:1.5px dashed var(--idle)}
  .gi.warn{background:var(--now);color:var(--now-on)}
  .gi.bad{background:var(--bad);color:#fff}
  .gt{font-size:15px;font-weight:650;line-height:1.35}
  .gs{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
  .gk{font-size:12px;font-weight:750;color:var(--quiet);padding-top:3px}
  .ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:start;padding:9px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .whead+.ev{border-top:0;padding-top:0}
  .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut)}
  .ev>span{padding-top:2px;overflow-wrap:anywhere}
  .ev em{font-style:normal;font-size:12.5px;color:var(--quiet);white-space:nowrap;padding-top:3px}
  .need{padding:13px 0;border-top:1px solid var(--line)}
  .whead+.need{border-top:0;padding-top:0}
  .nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:650}
  .nh span{font-size:14px;font-weight:600;color:var(--mut)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .key{font-size:12.5px;padding:5px 9px;border-radius:9px;background:var(--inset);color:var(--tx2);overflow-wrap:anywhere}
  .nl{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--tx2);line-height:1.45}
  .nl li{overflow-wrap:anywhere}
  .nl li+li{margin-top:7px}
  .nl.n0{margin-top:0}
  .nl+.btn-soft{margin-top:12px}
  .prep{border:2px solid var(--now)}
  .prep .wt i{width:28px;height:28px;border-radius:8px;background:var(--now);color:var(--now-on);display:inline-flex;align-items:center;justify-content:center}
  .blind-top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}

<!-- Плашка о потере связи живёт вне #app: render() переписывает #app целиком. -->
<div class="lost" hidden><div id="link" role="status" hidden></div></div>
<div class="wrap" id="app"></div>

<!-- Состояние приходит двумя путями, и порядок этих двух тегов — весь смысл.
     Сначала снимок, вписанный внутрь страницы: он есть всегда, поэтому дашборд
     показывает данные, чем бы его ни открыли — двойным кликом, панелью через
     data:, с мёртвым сервером, через месяц после прогона. Потом файл рядом: он
     перекрывает снимок там, где у страницы есть адрес, и он же подгружается
     заново каждые десять секунд, чтобы часы шли без перезагрузки.
     Разойтись в противоположные стороны им нечем: файл пишется на каждой
     правке, снимок — на каждом вызове .soft-task/st.py, и он же вписывает
     файл в страницу, так что снимок либо равен файлу, либо старше его.
     Между маркерами правит только st.py; руками — никогда. -->
<script>/*STATE-BEGIN*/window.STATE=null;/*STATE-END*/</script>
<script src="state.js"></script>

const systemDark = () => {
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) { return false; }
};
const storedTheme = () => {
  try { return localStorage.getItem('soft-task-theme'); } catch(e) { return null; }
};
// Явный выбор пользователя перевешивает системную тему; до первого клика — системная.
function effectiveTheme(){
  return storedTheme() || (systemDark() ? 'dark' : 'light');
}
function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 10, b = Math.abs(n) % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
};
const en = (n, one, many) => n === 1 ? one : many;

function detectLang() {
  try {
    const saved = localStorage.getItem('soft-task-lang');
    if (saved && I18N[saved]) return saved;
  } catch (e) {}
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('uk')) return 'uk';
  if (nav.startsWith('ru')) return 'uk';
  return 'en';
}

// молча выключала опрос — и запоминала это, так что дашборд замирал навсегда.

let pulling = false;
let misses = 0;                    // неудачных подгрузок state.js подряд

let booted = false;

const UI = {filter: 'all', open: {}};

// Всё время считается из меток state.js. Незакрытый интервал тикает от текущего момента.
const toMs = v => { const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
const spanMs = (from, to) => {
  const a = toMs(from);
  if (a == null) return null;
  const b = to ? toMs(to) : Date.now();
  return Math.max(0, (b == null ? Date.now() : b) - a);
};
// ——— активное время ——————————————————————————————————————————————
// Часы прогона показывают работу, а не календарь: ушёл человек на сутки — часы стоят.
// Промежуток между соседними метками длиннее порога — это простой, а не работа.
// Порог — сорок пять минут: на реальных прогонах работа между метками укладывается
// в час, а простои идут часами и сутками (444 минуты, 4207, 7814).
// Ожидание ответа пользователя (waits, waiting) вычитается целиком: это время
// человека, а не сборки, и на дашборде оно идёт отдельным счётчиком.
let MARKS = [];
let WAITS = [];

// для прогонов, начатых до журнала beats. Хранится по прогону, переживает перезагрузку.
function rememberBeats(S){
  const key = 'soft-task-beats:' + (S.slug || '') + ':' + (S.startedAt || '');
  try {
    const seen = JSON.parse(localStorage.getItem(key) || '[]');
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1) {
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = toMs(v); if (t != null) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  (S.beats || []).forEach(push);
  rememberBeats(S).forEach(push);
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.tickets || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.waits || []).forEach(x => { push(x.from); push(x.to); });
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
function collectWaits(S){
  const out = [];
  (S.waits || []).forEach(w => {
    const a = toMs(w.from), b = toMs(w.to);
    if (a != null && b != null && b > a) out.push([a, b]);
  });
  if (S.waiting && !S.finishedAt) {
    const a = toMs(S.waiting.since);
    if (a != null) out.push([a, null]);
  }
  return out;
}

  let s = 0;

}
// Сумма промежутков между метками без ожидания пользователя; каждый обрезан по порогу простоя.
function activeMs(from, to){
  const a = toMs(from);
  if (a == null) return null;
  const b = (to && toMs(to)) || Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const gap = pts[i] - pts[i-1] - waitedIn(pts[i-1], pts[i]);
    s += Math.min(Math.max(0, gap), IDLE_CAP_MS);
  }
  return s;
}
// Стоят ли часы прямо сейчас — то есть тянется ли простой дольше порога.
// Ожидание ответа — не простой: у него своя подпись.
function idleNow(){
  const S = window.STATE || {};
  if (!S || S.finishedAt || S.waiting) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;

};

const hhmm = iso => { const t = toMs(iso); if (t == null) return ''; const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };

function timerHTML(from, to){

function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '—';
  const s = Math.floor(ms/1000);
  if (s < 60) return CUR.ago.s(s);
  const m = Math.floor(s/60);
  return m < 60 ? CUR.ago.m(m) : CUR.ago.h(Math.floor(m/60), m%60);
}

  const ms = spanMs(iso, null);

}
function tick(){
  const stopped = idleNow();

    el.textContent = fmtClock(activeMs(el.dataset.from, null));
  });
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmtClock(spanMs(el.dataset.since, null));
  });
  document.querySelectorAll('[data-idle-note]').forEach(el => { el.hidden = !stopped; });
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    // Молчание — повод присмотреться, но только когда никто не работает.
    // Пока таск идёт, записей внутри него нет по устройству процесса:
    // порог тогда — не пять минут, а заметно дольше самого долгого таска.
    const S = window.STATE || {};
    const busy = (S.tickets || []).some(t =>
      t.status === 'in-progress' || t.status === 'review' || t.status === 'repair');
    el.classList.toggle('stale', !S.finishedAt && !S.waiting
      && spanMs(el.dataset.ago, null) > (busy ? 2700000 : 300000));
  });
  document.querySelectorAll('[data-ago-short]').forEach(el => {
    el.textContent = agoShort(el.dataset.agoShort);
  });
}

// ——— автообновление ——————————————————————————————————————————————
// Страница не перезагружается: она подтягивает state.js заново отдельным тегом.
// Встроенные панели (Claude Desktop, IDE-вьюверы) глушат навигацию — и
// location.reload(), и <meta http-equiv="refresh"> там молча ничего не делают,
// а загрузку подресурсов панель не трогает. Проверено измерением: reload и meta
// refresh не сработали ни разу, подгрузка тега — двенадцать раз из двенадцати.
// Но подресурсы живут только у страницы, у которой есть адрес. Панель Claude не
// открывает file:// как страницу — она вклеивает HTML в data:text/html, а оттуда
// origin равен null: state.js не грузится ни относительным путём, ни абсолютным
// file://, ни через fetch. Поэтому состояние вписано ещё и внутрь страницы.
// Живое обновление остаётся за http (панель через preview_start, обычный браузер).
// Видимость НЕ проверяем: те же панели держат document.hidden === true всё время.
// rev растёт на каждой записи st.py — и на синхронизации, которая не меняет
// updatedAt, но может закрыть этап или пересчитать манифест.
const stampOf = S => (S.rev || '') + '|' + (S.updatedAt || '') + '|' + (S.finishedAt || '') + '|' + (S.tickets || []).length;

function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== 'object') return;
  // Перерисовываем только когда состояние действительно сдвинулось: молчаливая
  // перерисовка раз в десять секунд сбрасывала бы выделенный текст ни за что.
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  // Упавший рендер не должен убивать страницу: сбрасываем штамп, чтобы следующий
  // круг опроса попробовал заново — иначе исправленный state.js уже не подберётся.
  try { render(CUR.lang); } catch (e) { lastStamp = ''; bootFail(String(e && e.message || e)); }
  window.scrollTo(0, y);
}

// Связь проверяется только там, где она вообще бывает: по http. Из data: файл не
// грузится никогда — там снимок и тишина; file:// читается с диска без сервера.
const SERVED = /^https?:$/.test(location.protocol);
function showLink(){
  const el = document.getElementById('link');
  if (!el) return;
  const lost = SERVED && misses >= 2 && !(window.STATE && window.STATE.finishedAt);
  el.hidden = !lost;
  el.parentNode.hidden = !lost;
  if (lost) el.textContent = CUR.lost;
}

// Одна подгрузка state.js; done(ok) — когда она закончилась.
function pullState(done){
  if (pulling) return;
  pulling = true;
  const s = document.createElement('script');
  // Метка времени в запросе — иначе file:// отдаст скрипт из кеша.
  s.src = 'state.js?t=' + Date.now();
  // Ошибка — обычное дело: файл могли поймать в момент записи. Две подряд —
  // уже не запись, а мёртвый сервер: тогда страница говорит об этом.
  const end = ok => {
    s.remove();
    pulling = false;
    misses = ok ? 0 : misses + 1;
    if (ok) applyState();
    showLink();
    if (done) done(ok);
  };
  s.onload = () => end(true);
  s.onerror = () => end(false);
  document.head.appendChild(s);
}

function pollState(){
  clearTimeout(pollT);
  if (window.STATE && window.STATE.finishedAt) return;
  pollT = setTimeout(() => pullState(pollState), POLL_MS);
}

// Стрелка сверху: подтянуть state.js сейчас, не дожидаясь круга опроса.
function refreshNow(btn){
  clearTimeout(pollT);
  if (btn) btn.classList.add('busy');
  const started = Date.now();
  pullState(ok => {
    if (!ok && btn) misses = Math.max(misses, 2);  // нажал и не получил — сказать сразу
    showLink();
    // Крутится хотя бы полсекунды: мгновенный ответ иначе не отличить от «не нажалось».
    setTimeout(() => {
      document.querySelectorAll('[data-refresh]').forEach(b => b.classList.remove('busy'));
    }, Math.max(0, 500 - (Date.now() - started)));
    pollState();
  });
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Статус таска → цвет полосы, значок, подписи. Ремонт — не «ещё немного
// разработки»: таск уже написан и вернулся с ревью, поэтому у него свой цвет.
const KIND = {
  'done':        {k:'done', bar:'f-done', icon:'check'},
  'in-progress': {k:'now',  bar:'f-now stripes', icon:'pen', on:true},
  'review':      {k:'rev',  bar:'f-rev', icon:'clock', on:true},
  'repair':      {k:'fix',  bar:'f-fix', icon:'rotate', on:true},
  'failed':      {k:'bad',  bar:'f-bad', icon:'x', on:true},
  'pending':     {k:'wait', bar:'f-wait', icon:'hourglass'}
};
const kindOf = t => KIND[t.status] || KIND.pending;
const REQ_KIND = {'done':'done', 'in-ticket':'work', 'in-spec':'work', 'open':'open',
  'placeholder':'placeholder', 'deferred':'deferred', 'dropped':'dropped'};
const REQ_PILL = {done:'p-done', work:'p-mut', open:'p-mut', placeholder:'p-now', deferred:'p-mut', dropped:'p-mut'};
const REQ_RANK = {placeholder:0, deferred:1, dropped:2};

function render(lang){
  const L = I18N[lang] || I18N.en;
  CUR = L;
  const S = STATE, T = S.tickets || [], R = S.requirements || {};
  MARKS = collectMarks(S);
  WAITS = collectWaits(S);
  const fin = !!S.finishedAt;
  const waiting = !fin && S.waiting ? S.waiting : null;

  const by = st => T.filter(t => t.status === st);
  const done = by('done'), writing = by('in-progress'), inReview = by('review'),
        inRepair = by('repair'), failedT = by('failed');
  const running = writing.concat(inReview, inRepair);
  const pending = T.length - done.length - running.length - failedT.length;
  const live = Math.max(0, (R.total || 0) - (R.dropped || 0));

  const mins = t => (t.startedAt && t.finishedAt)
    ? Math.max(1, Math.round(activeMs(t.startedAt, t.finishedAt) / 60000)) : null;
  const durations = done.map(mins).filter(Boolean).sort((a,b) => a-b);
  const median = durations.length ? durations[Math.floor(durations.length/2)] : null;

  // Этапы: канонический порядок, поверх него — то, что прислал state.js.
  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:'pending'});
  const stName = s => L.stages[s.id] || s.id;
  const activeStage = stages.find(s => s.status === 'active');
  const failedStage = stages.find(s => s.status === 'failed');
  const t0 = String(S.tier).toUpperCase() === 'T0';
  const stage = id => stages.find(s => s.id === id) || {};

  // ——— сколько осталось ———
  // По цепочке тасков в минутах, а не «медиана × длина цепочки»: иначе таск,
  // который идёт двадцать седьмую минуту, стоит в оценке как не начатый.
  // Плюс то, что идёт после разработки: ревью всей ветки и приёмка —
  // на реальных прогонах это почти половина времени, и без них оценка врала.
  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  const leftFor = t => {
    if (!t || t.status === 'done') return 0;
    const full = median || 10;
    if (t.status === 'review') return full * 0.2;
    if (t.status === 'repair') return full * 0.5;
    if (t.status === 'in-progress' && t.startedAt)
      return Math.max(1, full - (activeMs(t.startedAt, null) || 0) / 60000);
    return full;
  };
  const memo = {};
  function chainMin(id, seen){
    const t = byId[id];
    if (!t || t.status === 'done') return 0;
    if (memo[id] != null) return memo[id];
    if (seen.has(id)) return leftFor(t);
    seen.add(id);
    const d = leftFor(t) + Math.max(0, ...(t.blockedBy || []).map(b => chainMin(b, seen)));
    seen.delete(id);
    return memo[id] = d;
  }
  const cpMin = Math.max(0, ...T.map(t => chainMin(t.id, new Set())));
  const stageMin = id => { const s = stage(id); return s.startedAt ? (activeMs(s.startedAt, s.finishedAt) || 0) / 60000 : 0; };
  let left = null, lateEta = false;
  if (!fin && !waiting && !failedStage) {
    const buildSoFar = stageMin('build');
    if (activeStage && activeStage.id === 'build' && median) {
      left = cpMin + Math.max(10, 0.5 * (buildSoFar + cpMin)) + 8;
    } else if (activeStage && activeStage.id === 'review') {
      left = Math.max(5, 0.6 * buildSoFar - stageMin('review')) + 8; lateEta = true;
    } else if (activeStage && activeStage.id === 'final') {
      left = Math.max(3, 10 - stageMin('final')); lateEta = true;
    }
  }
  const eta = left ? [Math.max(1, Math.round(left * 0.75)), Math.max(2, Math.round(left * 1.4))] : null;
  const etaText = eta ? (eta[1] < 60 ? `${eta[0]}–${eta[1]}<small>${L.min}</small>`
    : `${fmtDur(eta[0])} — ${fmtDur(eta[1])}`) : '';

  // ——— шапка ———
  // Who is on a ticket right now: the reviewer while it is in review, the builder otherwise.
  const agentOf = t => (t.status === 'review' ? (t.reviewer || (S.agents || {}).reviewer) : null) || t.agent || '';
  const names = list => list.map(t => q(esc(t.title), L.lang)
    + (agentOf(t) ? ` <span class="ag-in">· ${esc(agentOf(t))}</span>` : '')).join(', ');
  let heroCls = '', stateLine, h2, lead = '', big = '', bigSub = '', hint = '';
  if (fin) {
    heroCls = 'won';
    const k = (S.debt?.emptyEnv || []).length, p = (S.debt?.placeholders || []).length;
    stateLine = `<span class="badge-ic">${ic('check','xs')}</span>${L.doneState}`;
    h2 = esc(S.result || L.doneDefault);
    lead = k || p ? L.doneNeed(k, p) : L.doneNothing;
    big = fmtClock(activeMs(S.startedAt, S.finishedAt));
    bigSub = L.doneBig(hhmm(S.finishedAt));
  } else if (waiting) {
    heroCls = 'ask';
    stateLine = `<span class="live" aria-hidden="true"></span>${L.waitState}`;
    h2 = L.waitH2[waiting.kind] || L.waitState;
    lead = waiting.note ? esc(waiting.note) : '';
    hint = `<span class="hint">${ic('msg','m')}${L.waitHint}</span>`;
    big = `<span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span>`;
    bigSub = L.waitBig;
  } else if (failedStage) {
    heroCls = 'bad';
    stateLine = `<span class="badge-ic">${ic('x','xs')}</span>${L.failState}`;
    h2 = L.failH2(stName(failedStage));
    lead = esc(failedStage.note || '');
  } else {
    const cur = activeStage || stages.find(s => s.status === 'pending') || stages[stages.length - 1];
    stateLine = `<span class="live" aria-hidden="true"></span>${L.stateRun[cur.id] || stName(cur)}`;
    if (cur.id === 'build' && T.length) {
      h2 = done.length === T.length ? L.buildAllDone(T.length) : L.buildH2(done.length, T.length, running.length);
      lead = [writing.length ? L.leadWriting(names(writing)) : '', inReview.length ? L.leadReview(names(inReview)) : '',
        inRepair.length ? L.leadRepair(names(inRepair)) : '', failedT.length ? L.leadFailed(names(failedT)) : '']
        .filter(Boolean).join(' ') || (done.length < T.length ? L.leadIdle : '');
    } else {
      h2 = L.h2Run[cur.id] || stName(cur);
      lead = cur.note ? esc(cur.note) : (L.leadRun[cur.id] || '');
    }
    if (eta) { big = etaText; bigSub = lateEta ? L.etaLate : L.etaLbl; }
    else if (cur.startedAt) { big = timerHTML(cur.startedAt, null); bigSub = L.stageClock(stName(cur)); }
  }
  // Шкала этапов: пройденное залито, текущее — в полоску, пропущенное — штриховкой.
  const segs = stages.map(s => {
    const st = s.status;
    let cls = 's-pend', fill = '0%', inner = '', time = L.ahead;
    if (st === 'done') { cls = 's-done'; fill = '100%'; time = s.startedAt ? timerHTML(s.startedAt, s.finishedAt) : '—'; }
    else if (st === 'skipped') { cls = 's-skip'; time = L.skipped; }
    else if (st === 'failed') { cls = 's-fail'; fill = '100%'; time = L.failedSt; }
    else if (st === 'active') {
      cls = 's-now'; inner = 'stripes';
      fill = s.id === 'build' && T.length ? Math.max(8, Math.round(done.length / T.length * 100)) + '%' : '50%';
      time = waiting ? L.waitingSt : (s.startedAt ? timerHTML(s.startedAt, null) : '—');
    }
    return `<div class="${cls}"><div class="seg"><i class="${inner}" style="width:${fill}"></i></div>
      <span class="s-name">${esc(stName(s))}</span><span class="s-time">${time}</span></div>`;
  }).join('');
  const hero = `<section class="hero ${heroCls} w" aria-live="polite">
    <div class="hero-top">
      <div class="hero-main"><div class="state">${stateLine}</div><h2>${h2}</h2>
        ${lead ? `<p class="lead">${lead}</p>` : ''}${hint}</div>
      ${big ? `<div class="big"><b>${big}</b><span>${bigSub}</span>
        <span class="paused" data-idle-note hidden>${L.paused}</span></div>` : ''}
    </div>
    <div class="track" role="list">${segs}</div>
  </section>`;

  // ——— плитки ———
  const reqList = S.reqList || [];
  const rk = {done:R.done||0, work:(R.inTicket||0)+(R.inSpec||0), ph:R.placeholder||0, def:R.deferred||0, drop:R.dropped||0};
  rk.open = Math.max(0, (R.total||0) - rk.done - rk.work - rk.ph - rk.def - rk.drop);
  const reqStack = `<div class="stack" aria-hidden="true">${[[rk.done,'f-done'],[rk.ph,'f-now'],[rk.work + rk.open,'f-idle'],[rk.def,'f-q']]
    .filter(x => x[0]).map(([n, c]) => `<i class="${c}" style="flex:${n}"></i>`).join('')}</div>`;
  const tileReq = `<section class="card tile w"><span class="tk">${L.tReqs}</span>${R.total
    ? `<span class="tv">${rk.done}<small>${L.of} ${live}</small></span>${reqStack}
       <span class="ts">${[L.reqParts.done, rk.work ? L.reqParts.work(rk.work) : '', rk.open ? L.reqParts.open(rk.open) : '', rk.ph ? L.reqParts.ph(rk.ph) : '',
         rk.def ? L.reqParts.def(rk.def) : '', rk.drop ? L.reqParts.drop(rk.drop) : ''].filter(Boolean).join(' · ')}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.reqLater}</span>`}</section>`;
  const retries = T.reduce((s,t) => s + (t.retries||0), 0), repairs = T.reduce((s,t) => s + (t.repairs||0), 0);
  const tileTk = `<section class="card tile w"><span class="tk">${L.tTickets}</span>${T.length
    ? `<span class="tv">${done.length}<small>${L.of} ${T.length}</small></span>
       <div class="sq" aria-hidden="true">${T.map(t => `<i class="${kindOf(t).bar}"></i>`).join('')}</div>
       <span class="ts">${(done.length === T.length
         ? [L.tkParts.all, repairs ? L.tkParts.repair(repairs) : '', retries ? L.tkParts.retry(retries) : '']
         : [writing.length ? L.tkParts.now(writing.length) : '', inReview.length ? L.tkParts.rev(inReview.length) : '',
            inRepair.length ? L.tkParts.fix(inRepair.length) : '', failedT.length ? L.tkParts.bad(failedT.length) : ''])
         .filter(Boolean).join(' · ') || L.leadIdle}</span>`
    : `<span class="tv dim">${t0 ? `<span style="font-size:.6em">${L.noSplit}</span>` : '—'}</span><span class="ts">${t0 ? '' : L.tkLater}</span>`}</section>`;
  const last = done[done.length - 1];
  const tests = S.tests || (last && last.tests) || null;
  const tileTests = `<section class="card tile w"><span class="tk">${L.tTests}</span>${tests
    ? `<span class="tv">${tests.passed}</span><span class="okb ${tests.failed ? 'f-bad' : 'f-done'}">${ic(tests.failed ? 'x' : 'check','xs')}${
        tests.failed ? L.testsBad(tests.failed) : L.testsOk}</span><span class="ts">${fin ? L.testsFinal : L.testsSub}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.testsLater}</span>`}</section>`;
  const B = S.blind;
  const tile4 = fin && B
    ? `<section class="card tile w"><span class="tk">${L.tBlind}</span><span class="tv">${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></span>
        <div class="stack" aria-hidden="true"><i class="f-done" style="flex:${+B.matched||0}"></i><i class="f-now" style="flex:${Math.max(0,(+B.checked||0)-(+B.matched||0))}"></i></div>
        <span class="ts">${L.blindSub((B.mismatches||[]).length)}</span></section>`
    : `<section class="card tile w"><span class="tk">${L.tTime}</span><span class="tv">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '—'}</span>
        <span class="ts">${L.timeSub}${median ? ' · ' + L.median(median) : ''}</span></section>`;

  // ——— ход сборки ———
  // Полоса показывает СОСТОЯНИЕ, а не долю: горизонтальная заливка в списке
  // задач читается как прогресс всегда. Длительность — цифрой справа.
  let buildCard = '';
  if (T.length) {
    const counts = {};
    T.forEach(t => { const k = kindOf(t).k; counts[k] = (counts[k] || 0) + 1; });
    const legend = ['done','now','rev','fix','bad','wait'].filter(k => counts[k]).map(k =>
      `<span class="lg"><i class="${{done:'f-done',now:'f-now',rev:'f-rev',fix:'f-fix',bad:'f-bad',wait:'f-wait'}[k]}"></i>${L.kinds[k]} <b>${counts[k]}</b></span>`).join('');
    const waves = [...new Set(T.map(t => t.wave ?? 1))].sort((a,b) => a-b);
    const rows = waves.map(w => {
      const inWave = T.filter(t => (t.wave ?? 1) === w)
        .sort((a,b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
      const blockers = [...new Set(inWave.flatMap(t => t.blockedBy || []))].filter(b => byId[b] && byId[b].status !== 'done');
      const sub = inWave.every(t => t.status === 'pending') && blockers.length ? L.waveWaits(blockers)
        : inWave.length > 1 ? L.waveSub(inWave.length) : '';
      return `<div class="wave">${L.wave(w)}${sub ? ` <span>${sub}</span>` : ''}</div>` + inWave.map(t => {
        const k = kindOf(t);
        const time = t.status === 'done' ? fmtDur(mins(t)) : (t.startedAt && t.status !== 'pending') ? timerHTML(t.startedAt, t.finishedAt) : '—';
        const why = String(t.review || '').replace(/^(да|yes)\s*[—–-]\s*/i, '');
        const note = t.status === 'repair' && (t.repairFindings || []).length ? ['fix', L.noteRepair(t.repairFindings[t.repairFindings.length - 1])]
          : t.status === 'review' && /^(да|yes)/i.test(t.review || '') && why ? ['rev', L.noteReview(why)]
          : t.status === 'failed' && (t.concerns || []).length ? ['bad', t.concerns.join('; ')] : null;
        const extra = t.status === 'done' && (t.repairs || t.retries)
          ? ' · ' + [t.repairs ? L.tkParts.repair(t.repairs) : '', t.retries ? L.tkParts.retry(t.retries) : ''].filter(Boolean).join(' · ') : '';
        return `<div class="tl"><span class="tl-id${k.on ? ' on' : ''}">${esc(t.id)}</span>
          <div class="bar ${k.bar}" title="${esc(t.title + (agentOf(t) ? ' — ' + agentOf(t) : ''))}"><span class="nm">${esc(t.title)}</span>
            ${agentOf(t) ? `<span class="ag">${esc(agentOf(t))}</span>` : ''}
            <span class="chipin">${ic(k.icon,'xs')}<span class="lbl">${L.chip[k.k]}${extra}</span></span></div>
          <span class="tl-time ${k.on ? k.k : ''}">${time}</span>
          ${note ? `<div class="tl-note ${note[0]}">${ic(KIND[t.status].icon)}<span>${esc(note[1])}</span></div>` : ''}</div>`;
      }).join('');
    }).join('');
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3><div class="legend">${legend}</div></div>${rows}</section>`;
  } else if (t0 && (activeStage?.id === 'build' || stage('build').status === 'done')) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.t0}</span></div></section>`;
  } else if (!fin) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.noTickets}</span></div></section>`;
  }

  // ——— списки ———
  const list = (key, arr, n, fmt) => {
    if (!arr || !arr.length) return '';
    const open = UI.open[key], shown = open ? arr : arr.slice(0, n);
    return `<ul class="nl n0">${shown.map(x => `<li>${fmt ? fmt(x) : esc(x)}</li>`).join('')}</ul>` + (arr.length > n
      ? `<button type="button" class="btn-soft" data-more="${key}">${open ? L.collapse + ic('up') : L.more(arr.length - n) + ic('chev')}</button>` : '');
  };
  // «файл:строка — суть» → адрес моноширинным, суть обычным текстом.
  const located = x => { const m = /^(\S+?(?::\d+[\w,-]*|\.\w+))\s+[—–-]\s+(.*)$/.exec(x); return m ? `<span class="mono" style="font-size:.9em;color:var(--mut)">${esc(m[1])}</span> — ${esc(m[2])}` : esc(x); };
  const env = S.debt?.emptyEnv || [], ph = S.debt?.placeholders || [], asm = S.debt?.assumptions || [];
  const keysBlock = env.length ? `<div class="need"><div class="nh">${L.envKeys}<span>${env.length}</span></div>
      <div class="keys">${env.map(k => `<code class="key">${esc(k)}</code>`).join('')}</div></div>` : '';
  const phBlock = ph.length ? `<div class="need"><div class="nh">${L.placeholders}<span>${ph.length}</span></div>${list('ph', ph, 3, located)}</div>` : '';
  const asmBlock = asm.length ? `<div class="need"><div class="nh">${L.assumptions}<span>${asm.length}</span></div>${list('asm', asm, 3)}</div>` : '';
  const needCard = fin
    ? (env.length || ph.length ? `<section class="card prep w"><div class="whead"><h3 class="wt"><i>${ic('flag')}</i>${L.prep}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section>` : '')
    : `<section class="card w"><div class="whead"><h3 class="wt">${L.need}</h3></div>${keysBlock + phBlock + asmBlock
        || `<p class="muted">${L.needEmpty}</p>`}</section>`;
  const asmCard = fin && asm.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.assumptions}</h3><span>${asm.length}</span></div>${list('asm', asm, 3)}</section>` : '';
  const report = S.report || [], concerns = S.concerns || [], additions = S.additions || [];
  const reportCard = report.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.report}</h3><span>${report.length}</span></div>${list('report', report, 3)}</section>` : '';
  const concernsCard = concerns.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.concerns}</h3><span>${concerns.length}</span></div>
      <p class="muted" style="margin-bottom:8px">${L.concernsNote}</p>${list('concerns', concerns, 3, located)}</section>` : '';
  const addCard = additions.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.additions}</h3><span>${additions.length}</span></div>${list('add', additions, 3)}</section>` : '';

  const blindCard = B ? `<section class="card w"><div class="whead"><h3 class="wt">${L.blind}</h3></div>
      <div class="blind-top"><b>${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></b><p>${L.blindNote} ${(B.mismatches||[]).length ? L.blindBad : L.blindOk}</p></div>
      ${(B.mismatches||[]).map(m => { const x = /^([RGA]\d+\w*)\s+[—–-]\s+(.*)$/.exec(m);
        return `<div class="req"><p>${x ? `<span class="rid">${esc(x[1])}</span>${esc(x[2])}` : esc(m)}</p></div>`; }).join('')}</section>` : '';

  // ——— твои слова ———
  let wordsCard = '';
  if (reqList.length) {
    const rows = reqList.map((r, i) => ({...r, k: REQ_KIND[r.status] || 'open', i}))
      .sort((a, b) => ((REQ_RANK[a.k] ?? 9) - (REQ_RANK[b.k] ?? 9)) || a.i - b.i);
    const cnt = {}; rows.forEach(r => { cnt[r.k] = (cnt[r.k] || 0) + 1; });
    const F = [['all', L.fAll, rows.length, ''], ['done', L.fDone, cnt.done, 'f-done'], ['work', L.fWork, cnt.work, 'f-idle'],
      ['open', L.fOpen, cnt.open, 'f-idle'], ['placeholder', L.fPh, cnt.placeholder, 'f-now'],
      ['deferred', L.fDef, cnt.deferred, 'f-q'], ['dropped', L.fDrop, cnt.dropped, 'f-q']].filter(f => f[2]);
    if (!F.some(f => f[0] === UI.filter)) UI.filter = 'all';
    const picked = rows.filter(r => UI.filter === 'all' || r.k === UI.filter);
    const open = UI.open.words, shown = open ? picked : picked.slice(0, 6);
    wordsCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.words}</h3><span>${L.wordsSub(rows.length)}</span></div>
      ${F.length > 2 ? `<div class="chips" role="group">${F.map(([id, lbl, n, sw]) =>
        `<button type="button" class="chip" data-filter="${id}" aria-pressed="${UI.filter === id}">${sw ? `<i class="${sw}"></i>` : ''}${lbl} <span>${n}</span></button>`).join('')}</div>` : ''}
      ${shown.map(r => `<div class="req"><div style="min-width:0"><p><span class="rid">${esc(r.id)}</span>${esc(r.text)}</p>${
        r.why ? `<span class="why">${esc(r.why)}</span>` : ''}</div><span class="pill ${REQ_PILL[r.k]}">${L.rs[r.k]}</span></div>`).join('')}
      ${picked.length > 6 ? `<div class="more"><button type="button" class="btn-soft" data-more="words">${open ? L.collapse + ic('up') : L.showAll(picked.length) + ic('chev')}</button></div>` : ''}
    </section>`;
  }

  // ——— проверки ———
  const G = Object.assign({}, S.gates || {});
  if (!G.G2 && S.coverage) G.G2 = {ok: true, found: S.coverage.found, fixed: S.coverage.fixed, deferred: S.coverage.deferred};
  if (!G.G4 && B) G.G4 = {ok: !(B.mismatches || []).length, matched: B.matched, checked: B.checked};
  const gate = (id, cls, icon, sub) => `<div class="gate"><span class="gi ${cls}">${ic(icon,'xs')}</span><div><div class="gt">${L.gT[id]}</div><div class="gs">${sub}</div></div><span class="gk">${id}</span></div>`;
  const later = (id, sub) => gate(id, 'wait', 'clock', fin ? L.gNone : sub);
  const g1 = G.G1 ? (G.G1.ok ? gate('G1','ok','check',L.g1ok(G.G1.total || R.total || 0)) : gate('G1','warn','alert',L.g1bad(G.G1.open || 0)))
    : waiting && waiting.kind === 'briefing' ? gate('G1','warn','msg',L.g1ask) : later('G1', L.g1later);
  const g2 = G.G2 ? gate('G2', G.G2.ok ? 'ok' : 'warn', G.G2.ok ? 'check' : 'alert', L.g2(+G.G2.found||0, +G.G2.fixed||0, +G.G2.deferred||0)) : later('G2', L.g2later);
  const g3 = G.G3 ? (G.G3.ok ? gate('G3','ok','check',L.g3ok(live, T.length)) : gate('G3','bad','x',L.g3bad(G.G3.problems || 0))) : later('G3', L.g3later);
  const g4 = G.G4 ? gate('G4', G.G4.ok ? 'ok' : 'warn', G.G4.ok ? 'check' : 'alert',
      L.g4(esc(G.G4.matched), esc(G.G4.checked), Math.max(0, (+G.G4.checked||0) - (+G.G4.matched||0)))) : later('G4', L.g4later);
  const okGates = ['G1','G2','G3','G4'].filter(g => G[g] && G[g].ok).length;
  const gatesCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.gates}</h3><span>${L.gatesOf(okGates)}</span></div>${g1}${g2}${g3}${g4}</section>`;

  // ——— лента ———
  const evText = e => {
    const V = L.ev;
    if (e.k === 'stage') return (V.stage[e.act] || V.stage.start)(L.stages[e.id] || e.id, e.note);
    if (e.k === 'ticket') return (V.ticket[e.act] || V.ticket.start)(e.ids || [], e.act === 'done' ? e.tests : e.note);
    if (e.k === 'gate') return (V.gate[e.g] || (() => e.g))(e.ok, e);
    if (e.k === 'add') return (V.add[e.key] || (n => `${e.key}: +${n}`))(e.n || 1);
    if (e.k === 'tickets') return V.tickets(e.n || 0);
    if (e.k === 'tests') return V.tests(e);
    if (e.k === 'ask') return V.ask(e);
    return typeof V[e.k] === 'string' ? V[e.k] : null;
  };
  const evTone = e => e.k === 'finish' ? ['f-done','flag'] : e.k === 'ask' ? ['f-now','msg'] : e.k === 'answered' ? ['','msg']
    : e.k === 'gate' ? (e.ok ? ['f-done','shield'] : ['f-now','alert'])
    : e.k === 'ticket' ? ({done:['f-done','check'], review:['f-rev','clock'], repair:['f-fix','rotate'], fail:['f-bad','x']}[e.act] || ['','play'])
    : e.k === 'stage' ? ({done:['f-done','check'], fail:['f-bad','x'], skip:['','chev']}[e.act] || ['','play'])
    : e.k === 'tests' ? [e.failed ? 'f-bad' : 'f-done', e.failed ? 'x' : 'check'] : e.k === 'add' ? ['','plus'] : ['','list'];
  const feedRows = (S.log || []).filter(e => e.k !== 'tier').slice(-12).reverse().map(e => {
    const text = evText(e);
    if (!text) return '';
    const [cls, icon] = evTone(e);
    return `<div class="ev"><span class="ei ${cls}">${ic(icon,'xs')}</span><span>${esc(text)}</span>${
      fin ? `<em>${hhmm(e.t)}</em>` : `<em data-ago-short="${esc(e.t)}">${agoShort(e.t)}</em>`}</div>`;
  }).join('');
  const feedCard = feedRows ? `<section class="card w"><div class="whead"><h3 class="wt">${L.feed}</h3>${fin ? '' :
    `<span data-ago="${esc(S.updatedAt || '')}">${S.updatedAt ? agoText(S.updatedAt) : ''}</span>`}</div>${feedRows}</section>` : '';

  // ——— раскладка ———
  // Слева — длинное (слова, ход сборки в отчёте), справа — короткое; «Понадобится»
  // слева под словами, иначе правая колонка уходит вниз, а левая стоит пустой.
  const leftCol = fin ? [needCard, blindCard, buildCard, wordsCard] : [wordsCard, needCard];
  const rightCol = fin ? [gatesCard, reportCard, asmCard, concernsCard, addCard, feedCard]
                    : [gatesCard, feedCard, reportCard, concernsCard, addCard];
  const when = S.startedAt ? (fin
    ? L.startedRange(new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'uk-UA', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}), hhmm(S.finishedAt))
    : L.started(new Date(S.startedAt).toDateString() === new Date().toDateString()
        ? `${L.today} ${hhmm(S.startedAt)}`
        : new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'uk-UA', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}))) : '';

  document.documentElement.lang = L.lang;
  const app = document.getElementById('app');
  app.innerHTML = `
  <header class="top">
    ${logoImg()}
    <div class="tools">
      ${fin ? '' : `<button type="button" class="iconbtn" data-refresh title="${L.refresh}" aria-label="${L.refresh}">${ic('sync')}</button>`}
      <div class="tabs" role="group" aria-label="${L.themeLabel}">
        <button type="button" data-theme="light" title="${L.themeLight}" aria-label="${L.themeLight}" aria-pressed="${effectiveTheme()==='light'}">${ic('sun')}</button>
        <button type="button" data-theme="dark" title="${L.themeDark}" aria-label="${L.themeDark}" aria-pressed="${effectiveTheme()==='dark'}">${ic('moon')}</button>
      </div>
      <div class="tabs" role="group" aria-label="${L.langLabel}">
        <button type="button" data-lang="en" aria-pressed="${L.lang==='en'}">EN</button>
        <button type="button" data-lang="uk" aria-pressed="${L.lang==='uk'}">UK</button>
      </div>
    </div>
  </header>
  <div class="title">
    <h1>${esc(S.title)}</h1>
    <div class="meta">${S.mode ? `<span class="tag">${esc(L.modes[S.mode] || S.mode)}</span>` : ''}${
      S.depth ? `<span class="tag">${esc(L.depths[S.depth] || S.depth)}</span>` : ''}${
      (S.agents || {}).executor ? `<span class="tag mono">${esc(S.agents.executor)}</span>` : ''}<span class="when">${when}</span></div>
  </div>
  ${hero}
  <div class="tiles">${tileReq}${tileTk}${tileTests}${tile4}</div>
  ${fin ? '' : buildCard}
  <div class="cols"><div class="col">${leftCol.join('')}</div><div class="col">${rightCol.join('')}</div></div>
  <footer>
    <span>${L.filesIn} <code>.soft-task/${esc(S.dir || S.slug)}/</code></span>
    <span>${fin ? L.frozen : `${L.updated}: <span data-ago="${esc(S.updatedAt || '')}"
      title="${S.updatedAt ? esc(new Date(S.updatedAt).toLocaleString(L.lang==='en'?'en-GB':'uk-UA')) : ''}">${S.updatedAt ? agoText(S.updatedAt) : '—'}</span>`}</span>
  </footer>`;

  // Вкладка подписана проектом: когда репозиторий дорабатывают второй раз, это
  // единственное место, где видно, что на экране прошлый прогон. Пока сборка ждёт
  // человека, вкладка говорит об этом — её видно, даже когда дашборд в фоне.
  document.title = (waiting ? L.tabWait + ' — ' : '') + (S.title ? `${S.title} — soft-task` : 'soft-task');

  if (!booted) {
    booted = true;
    app.classList.add('boot');
    setTimeout(() => app.classList.remove('boot'), 1400);
  }
  tick();
  showLink();
  if (!pulling) pollState();
}

// Один обработчик на всё: #app переписывается целиком на каждом событии сборки.
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) {
    try { localStorage.setItem('soft-task-lang', b.dataset.lang); } catch(err) {}
    render(b.dataset.lang);
  } else if (b.dataset.theme) {
    const t = b.dataset.theme;
    try { localStorage.setItem('soft-task-theme', t); } catch(err) {}
    applyTheme(t);
    document.querySelectorAll('button[data-theme]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.theme === t)));
  } else if (b.hasAttribute('data-refresh')) {
    refreshNow(b);
  } else if (b.dataset.filter) {
    UI.filter = b.dataset.filter; UI.open.words = false; render(CUR.lang);
  } else if (b.dataset.more) {
    UI.open[b.dataset.more] = !UI.open[b.dataset.more]; render(CUR.lang);
  }
});

let savedLang = detectLang();

applyTheme(storedTheme());

// Empty screen should explain what broke — keep polling until state.js appears.
function bootFail(why){
  const app = document.getElementById('app');
  if (!app) return;
  const L = I18N[detectLang()] || I18N.en;
  app.innerHTML = `<header class="top">${logoImg()}</header>
    <section class="card"><h3 class="wt">${L.boot}</h3><p class="muted" style="margin-top:10px">${why}</p>
    <p class="muted" style="margin-top:10px">${L.bootHelp}</p></section>`;
}

if (typeof STATE === 'undefined' || !STATE || typeof STATE !== 'object') {
  bootFail((I18N[detectLang()] || I18N.en).bootWhy);
  pollState();
} else {
  try {
    render(I18N[savedLang] ? savedLang : detectLang());
    lastStamp = stampOf(STATE);
  } catch (e) {
    bootFail(esc(String(e && e.message || e)));
    pollState();
  }
}

// Секундная стрелка для всех незакрытых интервалов и для «обновлено N назад».
setInterval(tick, 1000);

// Возврат на вкладку — повод не ждать очередного круга опроса.
// После сна компьютера — тоже: таймеры страницы стояли вместе с ним.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); refreshNow(); } });
window.addEventListener('pageshow', e => { if (e.persisted) { tick(); refreshNow(); } });

// Пока пользователь не выбрал тему явно, дашборд следует за системной.
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (storedTheme()) return;
    document.querySelectorAll('button[data-theme]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.theme === effectiveTheme())));
  });
} catch(e) {}
</script>
</body>
</html>
